name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, ccr-cb9eedb4-1lw3k5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the site files, not the README or workflow config.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r *.html favicon.ico css js images _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
